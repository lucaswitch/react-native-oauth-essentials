buildscript {
  ext.OauthEssentials = [
    kotlinVersion    : "2.0.21",
    minSdkVersion    : 24,
    compileSdkVersion: 36,
    targetSdkVersion : 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return OauthEssentials[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.oauthessentials"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  // googleid 1.2.1 ships Kotlin 2.4 metadata; the Kotlin of the app (RN: 2.1) only reads up to
  // 2.2. Only this module references its classes, and the bytecode is plain JVM.
  kotlinOptions {
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Needed oauth libraries
  implementation 'androidx.browser:browser:1.10.0'
  implementation('androidx.credentials:credentials') {
    version { strictly '1.6.0' }
  }
  implementation('androidx.credentials:credentials-play-services-auth') {
    version { strictly '1.6.0' }
  }
  implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
  implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
